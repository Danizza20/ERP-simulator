name: Neo4j DataCamp Tutorial - 179996

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/179996"

jobs:
  neo4j-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password

    steps:
      # 1. Descargar el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instalar las dependencias del tutorial
      - name: Install Tutorial Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j python-dotenv tqdm pandas

      # 4. Esperar a que Neo4j esté disponible
      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          auth = (
              os.environ["NEO4J_USERNAME"],
              os.environ["NEO4J_PASSWORD"]
          )

          for attempt in range(1, 31):
              try:
                  with GraphDatabase.driver(uri, auth=auth) as driver:
                      driver.verify_connectivity()
                  print("Neo4j connection successful!")
                  break
              except Exception as error:
                  print(f"Waiting for Neo4j ({attempt}/30): {error}")
                  time.sleep(5)
          else:
              raise RuntimeError("Neo4j did not become available.")
          PY

      # 5. Descargar el script de ingesta del tutorial
      - name: Download DataCamp Football Dataset Script
        run: |
          curl -fL \
            https://raw.githubusercontent.com/BexTuychiev/medium_stories/refs/heads/master/2024/9_september/3_neo4j_python/ingest_football_data.py \
            -o ingest_football_data.py

      # 6. Cargar los datos en Neo4j
      - name: Ingest Football Data
        run: |
          python ingest_football_data.py

      # 7. Ejecutar consultas Cypher del tutorial
      - name: Execute DataCamp Cypher Queries
        run: |
          python - <<'PY'
          import os
          from neo4j import GraphDatabase
          from neo4j.time import DateTime

          uri = os.environ["NEO4J_URI"]
          username = os.environ["NEO4J_USERNAME"]
          password = os.environ["NEO4J_PASSWORD"]

          driver = GraphDatabase.driver(
              uri,
              auth=(username, password)
          )

          driver.verify_connectivity()
          print("Connection successful!")

          # Query 1: Own goals in FIFA World Cup matches
          query_1 = """
          MATCH (p:Player)-[s:SCORED_IN]->(m:Match)
                -[:PART_OF]->(t:Tournament)
          WHERE t.name = 'FIFA World Cup'
            AND s.minute > 80
            AND s.own_goal = true
          RETURN p.name AS Player,
                 m.date AS Date,
                 s.minute AS Minute
          LIMIT 5
          """

          records, summary, keys = driver.execute_query(
              query_1,
              database_="neo4j"
          )

          print("\n--- FIFA World Cup Own Goals ---")
          for record in records:
              print(record.data())

          # Query 2: Team with the most World Cup wins
          query_2 = """
          MATCH (t:Team)-[:WON]->(m:Match)
                -[:PART_OF]->(:Tournament {
                    name: 'FIFA World Cup'
                })
          RETURN t.name AS Team,
                 COUNT(m) AS MatchesWon
          ORDER BY MatchesWon DESC
          LIMIT 1
          """

          records, summary, keys = driver.execute_query(
              query_2,
              database_="neo4j"
          )

          print("\n--- Team with Most World Cup Wins ---")
          for record in records:
              print(record.data())

          # Query 3: Create a coach and a relationship
          coach_query = """
          MATCH (t:Team {name: $team_name})
          CREATE (c:Coach {name: $coach_name})
          CREATE (c)-[r:COACHES]->(t)
          SET r.start_date = $start_date,
              r.end_date = $end_date
          RETURN c.name AS Coach, t.name AS Team
          """

          records, summary, keys = driver.execute_query(
              coach_query,
              database_="neo4j",
              coach_name="Lionel Scaloni",
              team_name="Argentina",
              start_date=DateTime(2018, 6, 1),
              end_date=None
          )

          if not records:
              raise RuntimeError("Argentina team was not found.")

          print("\n--- New Coach Relationship ---")
          for record in records:
              print(record.data())

          # Query 4: Count graph elements
          records, summary, keys = driver.execute_query(
              """
              MATCH (n)
              RETURN count(n) AS TotalNodes
              """,
              database_="neo4j"
          )

          print("\n--- Total Nodes ---")
          print(records[0]["TotalNodes"])

          records, summary, keys = driver.execute_query(
              """
              MATCH ()-[r]->()
              RETURN count(r) AS TotalRelationships
              """,
              database_="neo4j"
          )

          print("\n--- Total Relationships ---")
          print(records[0]["TotalRelationships"])

          driver.close()
          print("\nNeo4j DataCamp Tutorial completed successfully!")
          PY

